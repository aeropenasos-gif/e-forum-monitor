name: Eligna Forum Monitor

on:
  schedule:
    # На всеки 20 минути. Ако repo-то е ЧАСТНО (private), виж README.md
    # за препоръка да го смениш на 30 минути, за да останеш в
    # безплатните минути на GitHub Actions. Ако repo-то е ПУБЛИЧНО
    # (public), тази честота е напълно безплатна без ограничение.
    - cron: "*/20 * * * *"
  # Позволява ръчно стартиране от таб "Actions" в GitHub с бутона
  # "Run workflow" — полезно за тест.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "eligna-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen-state [skip ci]"
            git push
          else
            echo "Няма промяна в state/ — нищо за commit."
          fi
